name: Repro dispatchFetch keep-alive reset

on:
  push:
    branches:
      - repro/dispatchfetch-keepalive-reset
  workflow_dispatch:
    inputs:
      iterations:
        description: email.spec.ts runs per job
        default: "12"

permissions:
  contents: read

jobs:
  loop:
    name: ${{ matrix.arm }} / ${{ matrix.load }} / ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arm: [keepalive, reset]
        load: [cpu, suite]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Select dispatchFetch connection mode
        if: matrix.arm == 'reset'
        run: |
          sed -i '' 's/options.reset = false;/options.reset = true;/' packages/miniflare/src/http/fetch.ts
          grep -n "options.reset = true;" packages/miniflare/src/http/fetch.ts

      - run: pnpm --filter "miniflare..." build

      - name: Loop email.spec.ts under load
        working-directory: packages/miniflare
        env:
          ITERATIONS: ${{ inputs.iterations || '12' }}
          LOAD: ${{ matrix.load }}
          OUT: ${{ runner.temp }}/repro
        run: |
          set +e
          mkdir -p "$OUT"
          if [ "$LOAD" = cpu ]; then
            for c in 1 2 3; do yes > /dev/null & done
          else
            ( while true; do pnpm vitest run test/plugins/r2 test/plugins/kv test/plugins/d1 test/index.spec.ts > /dev/null 2>&1; done ) &
          fi
          deadline=$(( $(date +%s) + 50 * 60 ))
          for i in $(seq 1 "$ITERATIONS"); do
            [ "$(date +%s)" -lt "$deadline" ] || break
            TRACE_UNDICI_FILE="$OUT/trace-$i.txt" NODE_OPTIONS="--import $GITHUB_WORKSPACE/.github/repro/trace-undici.mjs" \
              pnpm vitest run test/plugins/local-explorer/email.spec.ts > "$OUT/run-$i.log" 2>&1
            code=$?
            clean=$(sed 's/\x1b\[[0-9;]*m//g' "$OUT/run-$i.log")
            echo "run $i exit=$code request_errors=$(grep -c REQUEST-ERROR "$OUT/trace-$i.txt" 2>/dev/null) $(echo "$clean" | grep -E '× |(read|write) ECONNRESET|Tests ' | tr -s ' ' | tr '\n' '|')" | tee -a "$OUT/summary.txt"
          done
          kill $(jobs -p) 2>/dev/null || true

      - name: Summarise
        if: always()
        env:
          OUT: ${{ runner.temp }}/repro
        run: |
          {
            echo "### ${{ matrix.arm }} / ${{ matrix.load }} / ${{ matrix.shard }}"
            echo '```'
            cat "$OUT/summary.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repro-${{ matrix.arm }}-${{ matrix.load }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/repro
