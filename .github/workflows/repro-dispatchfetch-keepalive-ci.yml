name: Repro dispatchFetch keep-alive reset (CI command)

on:
  push:
    branches:
      - repro/dispatchfetch-keepalive-reset
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.arm }} / ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [keepalive, reset]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Select dispatchFetch connection mode
        if: matrix.arm == 'reset'
        run: |
          sed -i '' 's/options.reset = false;/options.reset = true;/' packages/miniflare/src/http/fetch.ts
          grep -n "options.reset = true;" packages/miniflare/src/http/fetch.ts

      - name: Run tests (packages), as test-and-check.yml does
        continue-on-error: true
        run: |
          mkdir -p "$TRACE_UNDICI_DIR"
          pnpm run test:ci --log-order=stream --concurrency=3 --filter="./packages/*" 2>&1 | tee "$RUNNER_TEMP/test-ci.log"
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
          TRACE_UNDICI_DIR: ${{ runner.temp }}/traces
          TRACE_UNDICI_CWD_FILTER: packages/miniflare
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-debug-logs/
          CI_OS: macOS

      - name: Summarise
        if: always()
        run: |
          clean=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/test-ci.log")
          {
            echo "### ${{ matrix.arm }} / ${{ matrix.shard }}"
            echo '```'
            echo "$clean" | grep -E "miniflare:test:ci: +(×|FAIL) " | sort -u
            echo "$clean" | grep -E "miniflare:test:ci:.*(read|write) ECONNRESET|miniflare:test:ci: +Tests " | sort | uniq -c
            echo "request errors in traces: $(cat "$RUNNER_TEMP"/traces/*.txt 2>/dev/null | grep -c REQUEST-ERROR)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -l REQUEST-ERROR "$RUNNER_TEMP"/traces/*.txt > "$RUNNER_TEMP/traces/with-errors.list" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-${{ matrix.arm }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/test-ci.log
            ${{ runner.temp }}/traces
